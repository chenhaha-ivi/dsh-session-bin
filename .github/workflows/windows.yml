name: windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Workspace end-to-end
        run: node scripts/m1-e2e.mjs
      - name: Session end-to-end
        run: node scripts/m3-session-e2e.mjs
      - name: Move end-to-end
        run: node scripts/m3-move-e2e.mjs
