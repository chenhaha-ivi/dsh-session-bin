<svg width="640" height="300" viewBox="0 0 640 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sb-preview-title sb-preview-desc">
  <title id="sb-preview-title">Session recycle bin</title>
  <desc id="sb-preview-desc">A session row is dragged onto the recycle bin entry in the sidebar footer. The bin panel lists deleted sessions with restore and permanent-delete actions.</desc>
  <defs>
    <linearGradient id="sb-preview-bg" x1="24" y1="24" x2="616" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16233a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="sb-preview-bin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6d5fb"/>
      <stop offset="1" stop-color="#5269e1"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="592" height="252" rx="18" fill="url(#sb-preview-bg)" stroke="#2a3a55" stroke-width="1.5"/>
  <line x1="248" y1="42" x2="248" y2="258" stroke="#24334a"/>

  <!-- sidebar header -->
  <rect x="44" y="44" width="20" height="20" rx="6" fill="#1b2942" stroke="#33456b"/>
  <circle cx="54" cy="54" r="3" fill="#6d8df0"/>
  <rect x="72" y="48" width="100" height="10" rx="5" fill="#64748b" opacity="0.8"/>
  <rect x="44" y="76" width="70" height="7" rx="3.5" fill="#39496b"/>

  <!-- session rows -->
  <rect x="44" y="96" width="184" height="24" rx="8" fill="#1b2942" opacity="0.85"/>
