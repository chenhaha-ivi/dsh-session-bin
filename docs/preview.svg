    <path d="M3.5 9h13l-1.2 10a2.5 2.5 0 0 1-2.5 2.2h-5.6A2.5 2.5 0 0 1 4.7 19L3.5 9Z" fill="url(#sb-preview-bin)"/>
  </g>
