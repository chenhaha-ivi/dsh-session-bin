  <rect x="44" y="126" width="184" height="24" rx="8" fill="#1b2942" opacity="0.85"/>
  <circle cx="58" cy="138" r="3" fill="#5269e1" opacity="0.8"/>
  <rect x="70" y="134" width="96" height="8" rx="4" fill="#64748b" opacity="0.75"/>

  <rect x="44" y="156" width="184" height="24" rx="8" fill="none" stroke="#6d8df0" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.55"/>

  <rect x="44" y="186" width="184" height="24" rx="8" fill="#1b2942" opacity="0.85"/>
  <circle cx="58" cy="198" r="3" fill="#5269e1" opacity="0.8"/>
