  <polygon points="180,208 186,218 192,208" fill="#86b8f5"/>

  <!-- dragged session card -->
  <g transform="translate(138 136) rotate(-3 70 14)">
    <rect width="140" height="28" rx="9" fill="#22304a" stroke="#86b8f5" stroke-width="1.6"/>
    <circle cx="16" cy="14" r="3.5" fill="#86b8f5"/>
