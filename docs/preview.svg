  <rect x="344" y="194" width="130" height="7" rx="3.5" fill="#4a5d80"/>
  <g transform="translate(534 184)">
    <path d="M6 4h5.5a5.5 5.5 0 0 1 0 11H8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <path d="M8.5 0.5 4 4l4.5 3.5" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
