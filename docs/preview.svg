    <rect x="1.5" y="5" width="17" height="3" rx="1.5" fill="#f87171" opacity="0.85"/>
    <path d="M3.5 9h13l-1.2 10a2.5 2.5 0 0 1-2.5 2.2h-5.6A2.5 2.5 0 0 1 4.7 19L3.5 9Z" fill="#f87171" opacity="0.75"/>
